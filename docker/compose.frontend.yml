services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
    container_name: ${IRA_FRONTEND_CONTAINER_NAME:-iranet-frontend}
    restart: unless-stopped
    ports:
      - "${IRA_FRONTEND_PORT:-3000}:80"
