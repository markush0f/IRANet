services:
  postgres:
    image: postgres:16-alpine
    container_name: iranet-postgres
    environment:
      POSTGRES_USER: iranet
      POSTGRES_PASSWORD: iranetpass
      POSTGRES_DB: iranet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - iranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iranet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: iranet-backend
    environment:
      IRA_DATABASE_DSN: postgresql+asyncpg://iranet:iranetpass@postgres:5432/iranet
    volumes:
      - ../app/config:/app/config:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    networks:
      - iranet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: iranet-frontend
    ports:
      - "3000:80"
    networks:
      - iranet
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  iranet: